aid: lendorse
name: Lendorse
description: Lendorse GmbH is a Berlin-based education-finance company that funds international
  master's students studying in Europe through Income Share Agreements (ISAs) instead of
  traditional credit-scored loans. Students receive between EUR 3,000 and EUR 20,000 toward
  tuition, visa deposits, relocation and living costs, then repay a fixed 6-12% share of
  gross monthly income for 12 to 60 months once they earn above a EUR 2,500 monthly salary
  floor, with total repayment capped at 2.3x the funded amount. No collateral, co-signer,
  parental guarantor or credit check is required, which opens funding to students from
  developing and emerging markets who are normally excluded. Lendorse also provides
  mentorship, CV review, mock interviews and industry introductions. It covers universities
  in Austria, Belgium, France, Germany, Italy, Spain, Sweden and Switzerland, went through
  the Techstars and ABN AMRO Future of Finance Accelerator, and raised EUR 1.75M co-led by
  LUMO Labs and Soulmates Ventures. Lendorse publishes no public API, SDKs or developer
  portal as of July 2026; this profile is a company record rather than an API profile.
